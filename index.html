<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>EncuestasRD</title>
<meta name="theme-color" content="#14181C" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  html, body, #root { height: 100%; }
  body { margin: 0; }

  .bitacora-root {
    --ink: #EDE7DA;
    --ink-dim: #A9A192;
    --bg: #14181C;
    --bg-raised: #1B2126;
    --bg-sunken: #0F1316;
    --line: #2C343A;
    --stamp: #D79A3B;
    --stamp-dim: #7A5C2A;
    --teal: #4F8A8B;
    --danger: #C2634A;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .bitacora-root .serif { font-family: 'Fraunces', serif; }
  .bitacora-root ::selection { background: var(--stamp); color: #14181C; }
  .bitacora-scroll::-webkit-scrollbar { width: 8px; }
  .bitacora-scroll::-webkit-scrollbar-thumb { background: var(--line); }
  .bitacora-input { background: var(--bg-sunken); border: 1px solid var(--line); color: var(--ink); }
  .bitacora-input:focus { outline: none; border-color: var(--stamp-dim); }
  .bitacora-input::placeholder { color: var(--ink-dim); }
  .stamp-btn { background: var(--stamp); color: #14181C; }
  .stamp-btn:hover { background: #E6AC53; }
  .stamp-btn:disabled { background: var(--stamp-dim); color: #8a8378; cursor: not-allowed; }
  .ghost-btn:hover { background: var(--bg-raised); }
  .row-hover:hover { background: var(--bg-raised); }
  @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .rise-in { animation: riseIn .35s ease-out both; }
  .glyph { display: inline-block; line-height: 1; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

// ---------------------------------------------------------------------------
// Local storage (this replaces Claude's window.storage — everything here
// stays on the phone, in the browser/webview's own storage)
// ---------------------------------------------------------------------------
const localDB = {
  async get(key) {
    const raw = localStorage.getItem(key);
    return raw === null ? null : { key, value: raw };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
};

const uid = () => Math.random().toString(36).slice(2, 10);

async function loadSurveys() {
  try {
    const res = await localDB.get("surveys");
    return res ? JSON.parse(res.value) : [];
  } catch {
    return [];
  }
}
async function saveSurveys(surveys) {
  try {
    await localDB.set("surveys", JSON.stringify(surveys));
  } catch (e) {
    console.error("No se pudo guardar la encuesta", e);
  }
}
async function loadResponses(surveyId) {
  try {
    const res = await localDB.get(`responses:${surveyId}`);
    return res ? JSON.parse(res.value) : [];
  } catch {
    return [];
  }
}
async function saveResponses(surveyId, responses) {
  try {
    await localDB.set(`responses:${surveyId}`, JSON.stringify(responses));
  } catch (e) {
    console.error("No se pudieron guardar las respuestas", e);
  }
}

// --- anti-fraude -----------------------------------------------------------
async function hasAlreadyResponded(surveyId) {
  try {
    const res = await localDB.get(`responded:${surveyId}`);
    return !!res;
  } catch {
    return false;
  }
}
async function markAsResponded(surveyId) {
  try {
    await localDB.set(`responded:${surveyId}`, "1");
  } catch (e) {
    console.error("No se pudo registrar el envío", e);
  }
}
async function clearResponded(surveyId) {
  try {
    await localDB.delete(`responded:${surveyId}`);
  } catch {
    /* nothing to clear */
  }
}

function answersFingerprint(answers) {
  const entries = Object.keys(answers).sort().map((k) => [k, answers[k]]);
  return JSON.stringify(entries);
}

const FRAUD_THRESHOLDS = {
  minMsPerQuestion: 1200,
  duplicateWindowMs: 5 * 60 * 1000,
  burstWindowMs: 15 * 1000,
  burstCount: 3,
};

function detectFraudFlags({ answers, startedAt, submittedAt, questionCount, existing }) {
  const flags = [];
  const totalTime = submittedAt - startedAt;
  if (totalTime < questionCount * FRAUD_THRESHOLDS.minMsPerQuestion) flags.push("too_fast");

  const fingerprint = answersFingerprint(answers);
  const hasDuplicate = existing.some(
    (r) => answersFingerprint(r.answers) === fingerprint &&
      Math.abs(submittedAt - r.submittedAt) < FRAUD_THRESHOLDS.duplicateWindowMs
  );
  if (hasDuplicate) flags.push("duplicate");

  const recentCount = existing.filter(
    (r) => submittedAt - r.submittedAt >= 0 && submittedAt - r.submittedAt < FRAUD_THRESHOLDS.burstWindowMs
  ).length;
  if (recentCount >= FRAUD_THRESHOLDS.burstCount) flags.push("burst");

  return flags;
}

const FLAG_LABELS = {
  too_fast: "respondida muy rápido",
  duplicate: "posible duplicado",
  burst: "parte de una ráfaga de envíos",
};

// ---------------------------------------------------------------------------
// Tiny glyph "icons" — no external icon library needed
// ---------------------------------------------------------------------------
const Ico = ({ children, size = 14, color }) => (
  <span className="glyph" style={{ fontSize: size, color, width: size, textAlign: "center" }}>
    {children}
  </span>
);
const IcoPlus = (p) => <Ico {...p}>+</Ico>;
const IcoTrash = (p) => <Ico {...p}>✕</Ico>;
const IcoGrip = (p) => <Ico {...p}>⋮⋮</Ico>;
const IcoClipboard = (p) => <Ico {...p}>▤</Ico>;
const IcoShare = (p) => <Ico {...p}>↗</Ico>;
const IcoChart = (p) => <Ico {...p}>▥</Ico>;
const IcoPencil = (p) => <Ico {...p}>✎</Ico>;
const IcoChevronLeft = (p) => <Ico {...p}>‹</Ico>;
const IcoChevronRight = (p) => <Ico {...p}>›</Ico>;
const IcoUp = (p) => <Ico {...p}>˄</Ico>;
const IcoDown = (p) => <Ico {...p}>˅</Ico>;
const IcoCheck = (p) => <Ico {...p}>✓</Ico>;
const IcoX = (p) => <Ico {...p}>✕</Ico>;
const IcoCopy = (p) => <Ico {...p}>⧉</Ico>;
const IcoShield = (p) => <Ico {...p}>⚠</Ico>;
const IcoReset = (p) => <Ico {...p}>↺</Ico>;

// ---------------------------------------------------------------------------
// Simple bar visualization (no chart library required)
// ---------------------------------------------------------------------------
function SimpleBarChart({ data }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  return (
    <div className="space-y-2.5">
      {data.map((d, i) => (
        <div key={i} className="flex items-center gap-3">
          <span className="text-xs w-28 shrink-0 truncate" style={{ color: "var(--ink-dim)" }}>{d.name}</span>
          <div className="flex-1 h-3" style={{ background: "var(--bg-sunken)", border: "1px solid var(--line)" }}>
            <div style={{ width: `${(d.value / max) * 100}%`, background: "var(--stamp)", height: "100%" }} />
          </div>
          <span className="text-xs w-6 text-right" style={{ color: "var(--ink-dim)" }}>{d.value}</span>
        </div>
      ))}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Question types
// ---------------------------------------------------------------------------
const QUESTION_TYPES = [
  { id: "short_text", label: "Respuesta corta" },
  { id: "long_text", label: "Respuesta larga" },
  { id: "single_choice", label: "Opción única" },
  { id: "multiple_choice", label: "Opción múltiple" },
  { id: "rating", label: "Valoración (1–5)" },
];

function blankQuestion(type = "short_text") {
  const base = { id: uid(), type, text: "", required: false };
  if (type === "single_choice" || type === "multiple_choice") {
    return { ...base, options: ["Opción 1", "Opción 2"] };
  }
  return base;
}

function blankSurvey() {
  return { id: uid(), title: "Encuesta sin título", description: "", questions: [blankQuestion()], createdAt: Date.now() };
}

// ---------------------------------------------------------------------------
// Root
// ---------------------------------------------------------------------------
function App() {
  const [surveys, setSurveys] = useState(null);
  const [activeId, setActiveId] = useState(null);
  const [tab, setTab] = useState("editar");
  const [toast, setToast] = useState("");
  const [sidebarOpen, setSidebarOpen] = useState(false);

  useEffect(() => {
    (async () => {
      const s = await loadSurveys();
      setSurveys(s);
      if (s.length) setActiveId(s[0].id);
    })();
  }, []);

  const flashToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 2200);
  };

  const persist = useCallback(async (next) => {
    setSurveys(next);
    await saveSurveys(next);
  }, []);

  const createSurvey = async () => {
    const s = blankSurvey();
    const next = [s, ...(surveys || [])];
    await persist(next);
    setActiveId(s.id);
    setTab("editar");
    setSidebarOpen(false);
  };

  const updateSurvey = async (id, patch) => {
    const next = surveys.map((s) => (s.id === id ? { ...s, ...patch } : s));
    await persist(next);
  };

  const deleteSurvey = async (id) => {
    const next = surveys.filter((s) => s.id !== id);
    await persist(next);
    if (activeId === id) setActiveId(next[0]?.id ?? null);
  };

  if (surveys === null) {
    return (
      <div className="bitacora-root min-h-screen flex items-center justify-center">
        <p className="text-sm" style={{ color: "var(--ink-dim)" }}>Abriendo el cuaderno…</p>
      </div>
    );
  }

  const active = surveys.find((s) => s.id === activeId) || null;

  return (
    <div className="bitacora-root flex" style={{ minHeight: "100dvh" }}>
      <aside
        className={`w-64 shrink-0 flex-col fixed md:static inset-y-0 left-0 z-20 ${sidebarOpen ? "flex" : "hidden md:flex"}`}
        style={{ borderRight: "1px solid var(--line)", background: "var(--bg-sunken)" }}
      >
        <div className="px-5 pt-6 pb-4 flex items-center justify-between" style={{ borderBottom: "1px solid var(--line)" }}>
          <div>
            <div className="flex items-center gap-2">
              <IcoClipboard color="var(--stamp)" size={16} />
              <h1 className="serif text-lg">EncuestasRD</h1>
            </div>
            <p className="text-xs mt-1" style={{ color: "var(--ink-dim)" }}>un cuaderno de encuestas</p>
          </div>
          <button className="md:hidden text-sm" onClick={() => setSidebarOpen(false)} style={{ color: "var(--ink-dim)" }}>
            <IcoX size={16} />
          </button>
        </div>

        <button onClick={createSurvey} className="mx-4 mt-4 mb-2 flex items-center justify-center gap-2 py-2 text-sm font-medium stamp-btn">
          <IcoPlus size={13} /> Nueva encuesta
        </button>

        <div className="flex-1 overflow-y-auto bitacora-scroll px-2 mt-2">
          {surveys.length === 0 && (
            <p className="text-xs px-3 py-4" style={{ color: "var(--ink-dim)" }}>Todavía no hay encuestas registradas.</p>
          )}
          {surveys.map((s) => (
            <SurveyRow
              key={s.id}
              survey={s}
              active={s.id === activeId}
              onClick={() => { setActiveId(s.id); setTab("editar"); setSidebarOpen(false); }}
              onDelete={() => deleteSurvey(s.id)}
            />
          ))}
        </div>
      </aside>

      <main className="flex-1 flex flex-col min-w-0">
        <div className="md:hidden flex items-center gap-3 px-4 py-3" style={{ borderBottom: "1px solid var(--line)" }}>
          <button onClick={() => setSidebarOpen(true)} style={{ color: "var(--ink-dim)" }}><IcoGrip size={16} /></button>
          <span className="serif text-base">{active ? active.title : "EncuestasRD"}</span>
        </div>

        {active ? (
          <SurveyDetail
            key={active.id}
            survey={active}
            tab={tab}
            setTab={setTab}
            onUpdate={(patch) => updateSurvey(active.id, patch)}
            flashToast={flashToast}
          />
        ) : (
          <div className="flex-1 flex items-center justify-center p-8">
            <div className="text-center max-w-sm">
              <p className="serif text-2xl mb-2">El cuaderno está en blanco</p>
              <p className="text-sm" style={{ color: "var(--ink-dim)" }}>
                Crea una encuesta para empezar a anotar preguntas y reunir respuestas.
              </p>
            </div>
          </div>
        )}
      </main>

      {toast && (
        <div className="fixed bottom-6 right-6 left-6 md:left-auto px-4 py-2.5 text-sm rise-in" style={{ background: "var(--bg-raised)", border: "1px solid var(--line)" }}>
          {toast}
        </div>
      )}
    </div>
  );
}

function SurveyRow({ survey, active, onClick, onDelete }) {
  const [confirming, setConfirming] = useState(false);
  return (
    <div
      onClick={onClick}
      className="group flex items-center gap-2 px-3 py-2.5 mb-1 cursor-pointer row-hover"
      style={{ background: active ? "var(--bg-raised)" : "transparent", borderLeft: active ? "2px solid var(--stamp)" : "2px solid transparent" }}
    >
      <div className="flex-1 min-w-0">
        <p className="text-sm truncate" style={{ color: active ? "var(--ink)" : "var(--ink-dim)" }}>{survey.title || "Sin título"}</p>
        <p className="text-[11px]" style={{ color: "var(--ink-dim)" }}>
          {survey.questions.length} {survey.questions.length === 1 ? "pregunta" : "preguntas"}
        </p>
      </div>
      {confirming ? (
        <div className="flex items-center gap-1" onClick={(e) => e.stopPropagation()}>
          <button onClick={onDelete} className="p-1"><IcoCheck size={12} color="var(--danger)" /></button>
          <button onClick={() => setConfirming(false)} className="p-1"><IcoX size={12} color="var(--ink-dim)" /></button>
        </div>
      ) : (
        <button onClick={(e) => { e.stopPropagation(); setConfirming(true); }} className="opacity-0 group-hover:opacity-100 p-1">
          <IcoTrash size={12} color="var(--ink-dim)" />
        </button>
      )}
    </div>
  );
}

function SurveyDetail({ survey, tab, setTab, onUpdate, flashToast }) {
  const tabs = [
    { id: "editar", label: "Editar", Icon: IcoPencil },
    { id: "responder", label: "Responder", Icon: IcoShare },
    { id: "resultados", label: "Resultados", Icon: IcoChart },
  ];
  return (
    <div className="flex-1 flex flex-col min-w-0">
      <div className="px-4 md:px-8 pt-6 flex items-center gap-6 overflow-x-auto" style={{ borderBottom: "1px solid var(--line)" }}>
        {tabs.map((t) => {
          const isActive = tab === t.id;
          return (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              className="flex items-center gap-1.5 pb-3 text-sm whitespace-nowrap"
              style={{ color: isActive ? "var(--ink)" : "var(--ink-dim)", borderBottom: isActive ? "2px solid var(--stamp)" : "2px solid transparent" }}
            >
              <t.Icon size={13} /> {t.label}
            </button>
          );
        })}
      </div>
      <div className="flex-1 overflow-y-auto bitacora-scroll">
        {tab === "editar" && <EditorTab survey={survey} onUpdate={onUpdate} />}
        {tab === "responder" && <ResponderTab survey={survey} flashToast={flashToast} />}
        {tab === "resultados" && <ResultsTab survey={survey} />}
      </div>
    </div>
  );
}

function EditorTab({ survey, onUpdate }) {
  const setQuestions = (questions) => onUpdate({ questions });
  const addQuestion = (type) => setQuestions([...survey.questions, blankQuestion(type)]);
  const updateQuestion = (id, patch) => setQuestions(survey.questions.map((q) => (q.id === id ? { ...q, ...patch } : q)));
  const removeQuestion = (id) => setQuestions(survey.questions.filter((q) => q.id !== id));
  const moveQuestion = (index, dir) => {
    const next = [...survey.questions];
    const target = index + dir;
    if (target < 0 || target >= next.length) return;
    [next[index], next[target]] = [next[target], next[index]];
    setQuestions(next);
  };

  return (
    <div className="max-w-2xl mx-auto px-4 md:px-8 py-8">
      <input
        value={survey.title}
        onChange={(e) => onUpdate({ title: e.target.value })}
        placeholder="Título de la encuesta"
        className="serif w-full text-3xl bg-transparent border-none outline-none mb-3"
        style={{ color: "var(--ink)" }}
      />
      <textarea
        value={survey.description}
        onChange={(e) => onUpdate({ description: e.target.value })}
        placeholder="Describe brevemente el propósito de esta encuesta…"
        rows={2}
        className="w-full bg-transparent border-none outline-none resize-none text-sm mb-8"
        style={{ color: "var(--ink-dim)" }}
      />
      <div className="space-y-4">
        {survey.questions.map((q, i) => (
          <QuestionEditor
            key={q.id}
            index={i}
            question={q}
            total={survey.questions.length}
            onChange={(patch) => updateQuestion(q.id, patch)}
            onRemove={() => removeQuestion(q.id)}
            onMove={(dir) => moveQuestion(i, dir)}
          />
        ))}
      </div>
      <div className="flex flex-wrap gap-2 mt-6">
        {QUESTION_TYPES.map((t) => (
          <button key={t.id} onClick={() => addQuestion(t.id)} className="text-xs px-3 py-1.5 ghost-btn" style={{ border: "1px solid var(--line)", color: "var(--ink-dim)" }}>
            + {t.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function QuestionEditor({ index, question, total, onChange, onRemove, onMove }) {
  const isChoice = question.type === "single_choice" || question.type === "multiple_choice";
  const updateOption = (i, value) => { const options = [...question.options]; options[i] = value; onChange({ options }); };
  const addOption = () => onChange({ options: [...question.options, `Opción ${question.options.length + 1}`] });
  const removeOption = (i) => onChange({ options: question.options.filter((_, idx) => idx !== i) });

  return (
    <div className="p-4 rise-in" style={{ background: "var(--bg-raised)", border: "1px solid var(--line)" }}>
      <div className="flex items-start gap-3">
        <div className="flex flex-col items-center pt-1.5 gap-1">
          <IcoGrip size={12} color="var(--ink-dim)" />
          <span className="text-[11px]" style={{ color: "var(--ink-dim)" }}>{index + 1}</span>
        </div>
        <div className="flex-1 min-w-0">
          <input
            value={question.text}
            onChange={(e) => onChange({ text: e.target.value })}
            placeholder="Escribe la pregunta…"
            className="w-full bg-transparent border-none outline-none text-sm mb-2"
            style={{ color: "var(--ink)" }}
          />
          <div className="flex items-center gap-3 mb-3 flex-wrap">
            <select
              value={question.type}
              onChange={(e) => {
                const type = e.target.value;
                const patch = { type };
                if ((type === "single_choice" || type === "multiple_choice") && !question.options) {
                  patch.options = ["Opción 1", "Opción 2"];
                }
                onChange(patch);
              }}
              className="bitacora-input text-xs px-2 py-1"
            >
              {QUESTION_TYPES.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
            </select>
            <label className="flex items-center gap-1.5 text-xs" style={{ color: "var(--ink-dim)" }}>
              <input type="checkbox" checked={question.required} onChange={(e) => onChange({ required: e.target.checked })} />
              obligatoria
            </label>
          </div>
          {isChoice && (
            <div className="space-y-1.5">
              {question.options.map((opt, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="text-xs w-3" style={{ color: "var(--ink-dim)" }}>{question.type === "single_choice" ? "○" : "☐"}</span>
                  <input value={opt} onChange={(e) => updateOption(i, e.target.value)} className="bitacora-input flex-1 text-sm px-2 py-1" />
                  {question.options.length > 2 && (
                    <button onClick={() => removeOption(i)}><IcoX size={11} color="var(--ink-dim)" /></button>
                  )}
                </div>
              ))}
              <button onClick={addOption} className="text-xs mt-1" style={{ color: "var(--teal)" }}>+ añadir opción</button>
            </div>
          )}
          {question.type === "rating" && (
            <div className="flex gap-1.5 text-sm" style={{ color: "var(--ink-dim)" }}>
              {[1, 2, 3, 4, 5].map((n) => <span key={n} className="w-6 h-6 flex items-center justify-center" style={{ border: "1px solid var(--line)" }}>{n}</span>)}
            </div>
          )}
        </div>
        <div className="flex flex-col gap-1">
          <button onClick={() => onMove(-1)} disabled={index === 0} className="disabled:opacity-20"><IcoUp size={11} color="var(--ink-dim)" /></button>
          <button onClick={() => onMove(1)} disabled={index === total - 1} className="disabled:opacity-20"><IcoDown size={11} color="var(--ink-dim)" /></button>
          <button onClick={onRemove} className="mt-1"><IcoTrash size={12} color="var(--danger)" /></button>
        </div>
      </div>
    </div>
  );
}

function ResponderTab({ survey, flashToast }) {
  const [step, setStep] = useState(-1);
  const [answers, setAnswers] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [linkCopied, setLinkCopied] = useState(false);
  const [alreadyResponded, setAlreadyResponded] = useState(null);
  const [email, setEmail] = useState("");
  const [emailError, setEmailError] = useState("");
  const [checkingEmail, setCheckingEmail] = useState(false);
  const startedAtRef = useRef(null);

  const questions = survey.questions;
  const q = step >= 0 && step < questions.length ? questions[step] : null;

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const done = await hasAlreadyResponded(survey.id);
      if (!cancelled) setAlreadyResponded(done);
    })();
    return () => { cancelled = true; };
  }, [survey.id]);

  const setAnswer = (val) => setAnswers({ ...answers, [q.id]: val });
  const isValidEmail = (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());

  const begin = async () => {
    const trimmed = email.trim().toLowerCase();
    if (!isValidEmail(trimmed)) { setEmailError("Ingresa un correo electrónico válido."); return; }
    setCheckingEmail(true);
    const existing = await loadResponses(survey.id);
    const emailTaken = existing.some((r) => (r.email || "").toLowerCase() === trimmed);
    setCheckingEmail(false);
    if (emailTaken) { setEmailError("Ya se registró una respuesta con este correo."); return; }
    setEmailError("");
    startedAtRef.current = Date.now();
    setStep(0);
  };

  const canAdvance = () => {
    if (!q || !q.required) return true;
    const val = answers[q.id];
    if (q.type === "multiple_choice") return Array.isArray(val) && val.length > 0;
    return val !== undefined && val !== "";
  };

  const submit = async () => {
    setSubmitting(true);
    const existing = await loadResponses(survey.id);
    const submittedAt = Date.now();
    const flags = detectFraudFlags({ answers, startedAt: startedAtRef.current ?? submittedAt, submittedAt, questionCount: questions.length, existing });
    const record = { id: uid(), submittedAt, answers, flags, email: email.trim().toLowerCase() };
    await saveResponses(survey.id, [...existing, record]);
    await markAsResponded(survey.id);
    setAlreadyResponded(true);
    setSubmitting(false);
    setStep(questions.length);
    if (flags.length) flashToast("Respuesta guardada, pero quedó marcada como sospechosa.");
  };

  const respondAgain = async () => {
    await clearResponded(survey.id);
    setAlreadyResponded(false);
    setAnswers({});
    setEmail("");
    setEmailError("");
    setStep(-1);
  };

  const copyLink = () => {
    setLinkCopied(true);
    flashToast("Esta app vive en el teléfono; comparte el archivo o el enlace de instalación.");
    setTimeout(() => setLinkCopied(false), 1500);
  };

  if (questions.length === 0) {
    return (
      <div className="max-w-lg mx-auto px-4 md:px-8 py-16 text-center">
        <p className="text-sm" style={{ color: "var(--ink-dim)" }}>Añade al menos una pregunta en la pestaña Editar antes de recibir respuestas.</p>
      </div>
    );
  }

  if (step === -1) {
    if (alreadyResponded === null) {
      return <div className="max-w-lg mx-auto px-4 md:px-8 py-16 text-sm" style={{ color: "var(--ink-dim)" }}>Comprobando…</div>;
    }
    if (alreadyResponded) {
      return (
        <div className="max-w-lg mx-auto px-4 md:px-8 py-16">
          <div className="flex items-center gap-2 mb-3">
            <IcoShield size={15} color="var(--teal)" />
            <p className="text-xs" style={{ color: "var(--ink-dim)" }}>control anti-fraude</p>
          </div>
          <p className="serif text-2xl mb-2">Ya has respondido esta encuesta</p>
          <p className="text-sm mb-6" style={{ color: "var(--ink-dim)" }}>
            Desde este teléfono ya se registró una respuesta a «{survey.title}». Esto evita envíos duplicados accidentales; no es una verificación de identidad.
          </p>
          <button onClick={respondAgain} className="flex items-center gap-1.5 text-sm px-3 py-2" style={{ border: "1px solid var(--line)", color: "var(--ink-dim)" }}>
            <IcoReset size={12} /> Responder de nuevo de todos modos
          </button>
        </div>
      );
    }
    return (
      <div className="max-w-lg mx-auto px-4 md:px-8 py-16">
        <p className="serif text-3xl mb-3">{survey.title}</p>
        {survey.description && <p className="text-sm mb-6" style={{ color: "var(--ink-dim)" }}>{survey.description}</p>}
        <label className="block text-xs mb-1.5" style={{ color: "var(--ink-dim)" }}>Correo electrónico</label>
        <input
          type="email"
          value={email}
          onChange={(e) => { setEmail(e.target.value); if (emailError) setEmailError(""); }}
          onKeyDown={(e) => e.key === "Enter" && begin()}
          placeholder="tu@correo.com"
          className="bitacora-input w-full px-3 py-2 text-sm mb-1"
        />
        <p className="text-[11px] mb-6" style={{ color: emailError ? "var(--danger)" : "var(--ink-dim)" }}>
          {emailError || "Se pide para evitar respuestas duplicadas. No se comparte con nadie más."}
        </p>
        <div className="flex items-center gap-3 flex-wrap">
          <button onClick={begin} disabled={checkingEmail} className="stamp-btn text-sm px-5 py-2.5">{checkingEmail ? "Comprobando…" : "Empezar"}</button>
          <button onClick={copyLink} className="flex items-center gap-1.5 text-sm px-3 py-2.5" style={{ color: "var(--ink-dim)", border: "1px solid var(--line)" }}>
            <IcoCopy size={12} /> {linkCopied ? "Aviso mostrado" : "Cómo compartir"}
          </button>
        </div>
        <p className="text-[11px] mt-3" style={{ color: "var(--ink-dim)" }}>
          {questions.length} {questions.length === 1 ? "pregunta" : "preguntas"} · respuestas guardadas en este teléfono
        </p>
      </div>
    );
  }

  if (step === questions.length) {
    return (
      <div className="max-w-lg mx-auto px-4 md:px-8 py-16 text-center">
        <p className="serif text-2xl mb-2">Respuesta registrada</p>
        <p className="text-sm mb-6" style={{ color: "var(--ink-dim)" }}>Gracias por completar «{survey.title}».</p>
        <button onClick={respondAgain} className="text-sm px-4 py-2" style={{ border: "1px solid var(--line)", color: "var(--ink-dim)" }}>Responder de nuevo</button>
      </div>
    );
  }

  return (
    <div className="max-w-lg mx-auto px-4 md:px-8 py-16">
      <div className="flex gap-1 mb-8">
        {questions.map((_, i) => <div key={i} className="h-[3px] flex-1" style={{ background: i <= step ? "var(--stamp)" : "var(--line)" }} />)}
      </div>
      <p className="text-[11px] mb-2" style={{ color: "var(--ink-dim)" }}>Pregunta {step + 1} de {questions.length}</p>
      <p className="serif text-2xl mb-6">{q.text || "(pregunta sin texto)"}{q.required && <span style={{ color: "var(--stamp)" }}> *</span>}</p>
      <QuestionInput question={q} value={answers[q.id]} onChange={setAnswer} />
      <div className="flex items-center justify-between mt-10">
        <button onClick={() => setStep(step - 1)} disabled={step === 0} className="flex items-center gap-1 text-sm disabled:opacity-20" style={{ color: "var(--ink-dim)" }}>
          <IcoChevronLeft size={13} /> Atrás
        </button>
        {step === questions.length - 1 ? (
          <button onClick={submit} disabled={!canAdvance() || submitting} className="stamp-btn text-sm px-5 py-2">{submitting ? "Enviando…" : "Enviar respuestas"}</button>
        ) : (
          <button onClick={() => setStep(step + 1)} disabled={!canAdvance()} className="flex items-center gap-1 text-sm stamp-btn px-4 py-2 disabled:opacity-40">
            Siguiente <IcoChevronRight size={13} />
          </button>
        )}
      </div>
    </div>
  );
}

function QuestionInput({ question, value, onChange }) {
  if (question.type === "short_text") {
    return <input value={value || ""} onChange={(e) => onChange(e.target.value)} placeholder="Tu respuesta" className="bitacora-input w-full px-3 py-2 text-sm" />;
  }
  if (question.type === "long_text") {
    return <textarea value={value || ""} onChange={(e) => onChange(e.target.value)} placeholder="Tu respuesta" rows={4} className="bitacora-input w-full px-3 py-2 text-sm resize-none" />;
  }
  if (question.type === "single_choice") {
    return (
      <div className="space-y-2">
        {question.options.map((opt, i) => (
          <label key={i} className="flex items-center gap-3 px-3 py-2 cursor-pointer text-sm" style={{ border: "1px solid var(--line)", background: value === opt ? "var(--bg-raised)" : "transparent" }}>
            <input type="radio" checked={value === opt} onChange={() => onChange(opt)} /> {opt}
          </label>
        ))}
      </div>
    );
  }
  if (question.type === "multiple_choice") {
    const selected = Array.isArray(value) ? value : [];
    const toggle = (opt) => onChange(selected.includes(opt) ? selected.filter((o) => o !== opt) : [...selected, opt]);
    return (
      <div className="space-y-2">
        {question.options.map((opt, i) => (
          <label key={i} className="flex items-center gap-3 px-3 py-2 cursor-pointer text-sm" style={{ border: "1px solid var(--line)", background: selected.includes(opt) ? "var(--bg-raised)" : "transparent" }}>
            <input type="checkbox" checked={selected.includes(opt)} onChange={() => toggle(opt)} /> {opt}
          </label>
        ))}
      </div>
    );
  }
  if (question.type === "rating") {
    return (
      <div className="flex gap-2">
        {[1, 2, 3, 4, 5].map((n) => (
          <button key={n} onClick={() => onChange(n)} className="w-10 h-10 text-sm" style={{ border: "1px solid var(--line)", background: value === n ? "var(--stamp)" : "transparent", color: value === n ? "#14181C" : "var(--ink)" }}>
            {n}
          </button>
        ))}
      </div>
    );
  }
  return null;
}

function ResultsTab({ survey }) {
  const [responses, setResponses] = useState(null);
  const [includeFlagged, setIncludeFlagged] = useState(false);
  const [showFlaggedList, setShowFlaggedList] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const r = await loadResponses(survey.id);
      if (!cancelled) setResponses(r);
    })();
    return () => { cancelled = true; };
  }, [survey.id]);

  if (responses === null) return <div className="px-4 md:px-8 py-16 text-sm" style={{ color: "var(--ink-dim)" }}>Cargando respuestas…</div>;

  if (responses.length === 0) {
    return (
      <div className="max-w-lg mx-auto px-4 md:px-8 py-16 text-center">
        <p className="serif text-2xl mb-2">Aún no hay respuestas</p>
        <p className="text-sm" style={{ color: "var(--ink-dim)" }}>Ve a la pestaña Responder para registrar la primera.</p>
      </div>
    );
  }

  const flagged = responses.filter((r) => r.flags && r.flags.length > 0);
  const clean = responses.filter((r) => !r.flags || r.flags.length === 0);
  const activeResponses = includeFlagged ? responses : clean;

  return (
    <div className="max-w-2xl mx-auto px-4 md:px-8 py-8">
      <div className="mb-6">
        <p className="text-sm" style={{ color: "var(--ink-dim)" }}>
          {responses.length} {responses.length === 1 ? "respuesta registrada" : "respuestas registradas"}
          {flagged.length > 0 && (
            <>
              {" · "}
              <button onClick={() => setShowFlaggedList((v) => !v)} style={{ color: "var(--stamp)" }}>
                {flagged.length} {flagged.length === 1 ? "marcada" : "marcadas"} como sospechosa{flagged.length === 1 ? "" : "s"}
              </button>
            </>
          )}
        </p>
        {flagged.length > 0 && (
          <label className="flex items-center gap-2 text-xs mt-2" style={{ color: "var(--ink-dim)" }}>
            <input type="checkbox" checked={includeFlagged} onChange={(e) => setIncludeFlagged(e.target.checked)} />
            incluir respuestas sospechosas en las gráficas y listados de abajo
          </label>
        )}
        {showFlaggedList && flagged.length > 0 && (
          <div className="mt-3 p-3 space-y-2" style={{ background: "var(--bg-raised)", border: "1px solid var(--line)" }}>
            {flagged.map((r) => (
              <div key={r.id} className="flex items-center gap-2 text-xs">
                <IcoShield size={11} color="var(--danger)" />
                <span style={{ color: "var(--ink-dim)" }}>
                  {r.email || "(sin correo)"} · {new Date(r.submittedAt).toLocaleString()} — {r.flags.map((f) => FLAG_LABELS[f] || f).join(", ")}
                </span>
              </div>
            ))}
          </div>
        )}
      </div>
      <div className="space-y-8">
        {survey.questions.map((q) => <QuestionResult key={q.id} question={q} responses={activeResponses} />)}
      </div>
    </div>
  );
}

function QuestionResult({ question, responses }) {
  const answers = responses.map((r) => r.answers[question.id]).filter((a) => a !== undefined);

  if (question.type === "short_text" || question.type === "long_text") {
    return (
      <div>
        <p className="text-sm mb-3">{question.text || "(sin texto)"}</p>
        <div className="space-y-2 max-h-56 overflow-y-auto bitacora-scroll pr-2">
          {answers.length === 0 && <p className="text-xs" style={{ color: "var(--ink-dim)" }}>Sin respuestas todavía.</p>}
          {answers.map((a, i) => <p key={i} className="text-sm px-3 py-2" style={{ background: "var(--bg-raised)", border: "1px solid var(--line)" }}>{a}</p>)}
        </div>
      </div>
    );
  }

  let counts = {};
  if (question.type === "rating") {
    [1, 2, 3, 4, 5].forEach((n) => (counts[n] = 0));
    answers.forEach((a) => (counts[a] = (counts[a] || 0) + 1));
  } else if (question.type === "single_choice") {
    question.options.forEach((o) => (counts[o] = 0));
    answers.forEach((a) => (counts[a] = (counts[a] || 0) + 1));
  } else if (question.type === "multiple_choice") {
    question.options.forEach((o) => (counts[o] = 0));
    answers.forEach((a) => (a || []).forEach((o) => (counts[o] = (counts[o] || 0) + 1)));
  }
  const data = Object.entries(counts).map(([name, value]) => ({ name, value }));

  return (
    <div>
      <p className="text-sm mb-3">{question.text || "(sin texto)"}</p>
      <SimpleBarChart data={data} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
